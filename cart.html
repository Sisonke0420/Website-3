<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review your Peak Performance cart." />
    <title>Your Cart | Peak Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body class="theme-dark">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">PEAK<span>/</span>PERFORMANCE</a>
        <nav class="main-nav" aria-label="Main navigation">
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="journal.html">Journal</a></li>
            <li><a href="about.html">Our Story</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
        <div class="nav-actions">
          <a class="nav-pill" href="cart.html" aria-current="page">Cart (2)</a
          ><button class="menu-toggle" aria-label="Open menu">☰</button>
        </div>
      </div>
    </header>
    <main>
      <section class="page-hero small-hero">
        <div class="container reveal">
          <p class="section-kicker">Your selection</p>
          <h1>Ready when you are.</h1>
        </div>
      </section>
      <section class="container cart-layout section-space reveal">
        <div class="cart-items" data-cart-items></div>
        <aside class="cart-summary">
          <p class="section-kicker">Order summary</p>
          <div><span>Subtotal</span><strong data-cart-subtotal>R0</strong></div>
          <div><span>Shipping</span><span data-cart-shipping>Free</span></div>
          <div class="summary-total">
            <span>Total</span><strong data-cart-total>R0</strong>
          </div>
          <a class="btn btn-primary" href="checkout.html" data-checkout-link
            >Checkout</a
          >
          <button
            class="text-link clear-cart"
            type="button"
            data-cart-action="clear"
          >
            Clear cart
          </button>
          <p class="summary-note">
            Taxes calculated at checkout. Free delivery is included on this
            order.
          </p>
        </aside>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <a class="brand" href="index.html">PEAK<span>/</span>PERFORMANCE</a>
        <p>© <span id="year"></span> Peak Performance. Keep moving.</p>
      </div>
    </footer>
  </body>
</html>
